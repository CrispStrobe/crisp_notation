name: published release vs CometBeat

# downstream-cometbeat.yml tests CometBeat against this repo's SOURCE. This
# tests it against what pub.dev actually SERVES: the latest published
# crisp_notation and crisp_notation_core, swapped in for CometBeat's path
# dependencies. It catches what only a published package can break: a file
# missing from the archive (.pubignore), a wrong dependency constraint, a
# publish of the wrong commit. Runs weekly and after every publish, and
# opens or updates an issue labelled `published-release` on failure.
on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC, after the flutter canary
  workflow_run:
    workflows:
      - Publish crisp_notation to pub.dev
      - Publish crisp_notation_core to pub.dev
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cometbeat-on-published:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: CometBeat tests against the published packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout cometbeat
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/cometbeat
          ref: main
          path: cometbeat
      # CometBeat's other path dependencies still have to be present.
      - name: Checkout CrispEmbed
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/CrispEmbed
          ref: main
          path: CrispEmbed
      - name: Checkout onnx_runtime_dart
        uses: actions/checkout@v5
        with:
          repository: CrispStrobe/onnx_runtime_dart
          ref: main
          path: onnx_runtime_dart
      # Path deps on ../crisp_notation must resolve even though they are
      # overridden below: pub reads every declared path dependency.
      - name: Checkout crisp_notation (for path resolution only)
        uses: actions/checkout@v5
        with:
          path: crisp_notation

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4  # CometBeat's pinned SDK
          channel: stable

      - name: Point CometBeat at the published packages
        id: versions
        working-directory: cometbeat
        run: |
          latest() { curl -sSf "https://pub.dev/api/packages/$1" | jq -r .latest.version; }
          served() { curl -sSf -o /dev/null "https://pub.dev/api/packages/$1/versions/$2"; }
          want=$(grep '^version:' ../crisp_notation/packages/crisp_notation/pubspec.yaml | awk '{print $2}')
          wantCore=$(grep '^version:' ../crisp_notation/packages/crisp_notation_core/pubspec.yaml | awk '{print $2}')
          if [ "${{ github.event_name }}" = workflow_run ]; then
            # After a publish, test the versions just released — and only once
            # pub.dev serves BOTH (the `latest` field and pub's index lag the
            # upload, which made this check fail falsely right after #6/#7).
            for i in $(seq 1 40); do
              served crisp_notation "$want" && served crisp_notation_core "$wantCore" && break
              sleep 30
            done
            # A core-only publish whose crisp_notation is not out yet: test the
            # new core with the latest crisp_notation pub.dev does serve.
            if served crisp_notation "$want"; then ui=$want; else ui=$(latest crisp_notation); fi
            if served crisp_notation_core "$wantCore"; then core=$wantCore; else core=$(latest crisp_notation_core); fi
          else
            core=$(latest crisp_notation_core); ui=$(latest crisp_notation)
          fi
          printf 'dependency_overrides:\n  crisp_notation: %s\n  crisp_notation_core: %s\n' "$ui" "$core" > pubspec_overrides.yaml
          cat pubspec_overrides.yaml
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

      - name: flutter pub get (hosted crisp_notation)
        working-directory: cometbeat
        run: |
          # pub's index can trail the versions API by a few minutes.
          for i in 1 2 3 4 5 6; do flutter pub get && break; sleep 60; done
          flutter pub get
          # Prove the hosted packages, not the path checkout, were resolved.
          sed -n '/^  crisp_notation:/,/source:/p' pubspec.lock | grep -q 'source: hosted'
          sed -n '/^  crisp_notation_core:/,/source:/p' pubspec.lock | grep -q 'source: hosted'

      - name: CometBeat tests that touch crisp_notation
        id: tests
        working-directory: cometbeat
        run: |
          files=$(grep -rlE "package:crisp_notation|playbackTimeline|scoreFromMusicXml|MusicXml|endRepeat|tieToNext|Slur\(|LayoutEngine|StaffView|MultiSystemView" test | sort)
          echo "Running $(echo "$files" | wc -l) test files"
          flutter test $files

      # CometBeat tracks crisp_notation main by contract, so it routinely uses
      # API newer than the last release, and then it fails against pub.dev with
      # nothing wrong in the archive (#50). Telling the two cases apart takes one
      # more run: the same tests against the SOURCE at the published tag. If
      # that fails too, CometBeat is ahead of the release (cut one); if it
      # passes, the archive differs from its own source (the bug this hunts).
      - name: Same tests against the tagged source
        id: tagged
        if: failure() && steps.tests.outcome == 'failure'
        working-directory: cometbeat
        env:
          CORE: ${{ steps.versions.outputs.core }}
          UI: ${{ steps.versions.outputs.ui }}
        run: |
          verdict=unknown
          tag="crisp_notation-v$UI"
          if git -C ../crisp_notation fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag" &&
             git -C ../crisp_notation checkout -q --detach "$tag"; then
            tagCore=$(grep '^version:' ../crisp_notation/packages/crisp_notation_core/pubspec.yaml | awk '{print $2}')
            if [ "$tagCore" = "$CORE" ]; then
              # Without the override file, CometBeat's own path overrides apply.
              rm -f pubspec_overrides.yaml
              flutter pub get
              files=$(grep -rlE "package:crisp_notation|playbackTimeline|scoreFromMusicXml|MusicXml|endRepeat|tieToNext|Slur\(|LayoutEngine|StaffView|MultiSystemView" test | sort)
              if flutter test $files; then verdict=archive; else verdict=ahead; fi
            else
              echo "$tag carries crisp_notation_core $tagCore, not the published $CORE"
            fi
          fi
          echo "verdict=$verdict" | tee -a "$GITHUB_OUTPUT"

      - name: Report a failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CORE: ${{ steps.versions.outputs.core }}
          UI: ${{ steps.versions.outputs.ui }}
          VERDICT: ${{ steps.tagged.outputs.verdict }}
        run: |
          gh label create published-release -R "$GITHUB_REPOSITORY" --color B60205 \
            --description "CometBeat fails against the packages on pub.dev" 2>/dev/null || true
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --label published-release --state open --json number -q '.[0].number')
          case "$VERDICT" in
            ahead) why="CometBeat main fails against the tagged SOURCE (crisp_notation-v$UI) as well, so the archive is not at fault: CometBeat uses API newer than the release. Cut a release; this closes on the next green run." ;;
            archive) why="CometBeat passes against the tagged SOURCE (crisp_notation-v$UI) but fails against the archive, so the archive differs from its source. Suspect .pubignore, dependency constraints, or which commit was tagged." ;;
            *) why="The tagged-source comparison could not run (missing tag, or the two packages were not released from one commit). Suspect .pubignore, dependency constraints, which commit was tagged, or CometBeat using unreleased API." ;;
          esac
          body="CometBeat's crisp-dependent tests fail against the PUBLISHED packages (crisp_notation $UI, crisp_notation_core $CORE): $RUN
          $why"
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label published-release \
              --title "CometBeat fails against published crisp_notation $UI" --body "$body"
          fi
      - name: Close the issue when green again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --label published-release --state open --json number -q '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "Green again against ${{ steps.versions.outputs.ui }}."
          done
